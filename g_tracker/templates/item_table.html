{% extends "layout.html" %}
{% block title %}

{% endblock %}

{% block main %}
    <style>
      /* Keep the two category dropdowns from stretching the grid on narrow screens */
      .category-select {
        max-width: 11rem;
        font-size: 0.8rem;
        padding: 0.15rem 1.5rem 0.15rem 0.4rem;
      }
    </style>
    <div>
      <h1>Items</h1>
      <hr>
      <div id="table"></div>
    </div>
    <script src="https://unpkg.com/gridjs/dist/gridjs.umd.js"></script>
    <script defer>
      const tableDiv = document.getElementById('table');
      const receiptTotalDiv = document.getElementById('receipt-total');

      // Injected server-side rather than fetched: the page is already rendered by
      // Flask, so this avoids an async load racing the grid's first render.
      const TAXONOMY = {{ taxonomy|tojson }};

      const escapeHtml = (s) => String(s).replace(/[&<>"']/g, c => (
        {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]
      ));

      const categorySelect = (itemId, field, options, selected) => {
        const opts = options.map(o =>
          `<option value="${escapeHtml(o)}"${o === selected ? ' selected' : ''}>${escapeHtml(o)}</option>`
        ).join('');
        // An unknown value (legacy row, model typo) stays visible instead of silently
        // snapping to the first option — you can see what needs fixing.
        const orphan = (selected && !options.includes(selected))
          ? `<option value="${escapeHtml(selected)}" selected>${escapeHtml(selected)} (?)</option>`
          : '';
        return `<select class="form-select form-select-sm category-select"
                        data-item-id="${escapeHtml(itemId)}" data-field="${field}">${orphan}${opts}</select>`;
      };

      const updateUrl = (prev, query) => {
        return prev + (prev.indexOf('?') >= 0 ? '&' : '?') + new URLSearchParams(query).toString();
      };

      const editableCellAttributes = (data, row, col) => {
          if (row) {
            return {contentEditable: 'true', 'data-element-id': row.cells[0].data};
          }
          else {
            return {};
          }
      };

      new gridjs.Grid({
        columns: [
          { id: 'id', 'hidden': true },
          { id: 'name', name: 'Item', 'attributes': editableCellAttributes, 'sort': {
                          compare: (a, b) => {
                            return a.localeCompare(b);
                          }
            }
          },
          { id: 'amount', name: 'Amount', 'attributes': editableCellAttributes },
          { id: 'price', name: 'Price', 'attributes': editableCellAttributes, sort: {
                          compare: (a, b) => {
                              if (parseFloat(a) > parseFloat(b)) {
                                  return 1;
                              } else if (parseFloat(b) > parseFloat(a)) {
                                  return -1;
                              } else {
                                  console.log("Numbers are the same... A " + a + " B " + b);
                                  return 0;
                              }
                            },
                      },
          },
          { id: 'macro_category', name: 'Category', sort: false,
            formatter: (cell, row) => gridjs.html(
              categorySelect(row.cells[0].data, 'macro_category', Object.keys(TAXONOMY), cell))
          },
          { id: 'micro_category', name: 'Subcategory', sort: false,
            formatter: (cell, row) => gridjs.html(
              categorySelect(row.cells[0].data, 'micro_category', TAXONOMY[row.cells[4].data] || [], cell))
          },
          // Can't use url_for in javascript because of item_id reference
          { id: 'delete_item', name: 'Delete', formatter: (item_id) =>
              gridjs.html(`<a href="/delete-row?item_id=${item_id}" }}><img src="/static/delete_icon.svg"/></a>`)}
        ],
        server: {
          url: '/api/data',
          then: results => results.data.map(item =>
            [item.id, item.name, item.amount, item.price,
             item.macro_category, item.micro_category, item.id]),
          total: results => results.total,
          total_price: results => results.total_price
        },
        search: {
          enabled: true,
          server: {
            url: (prev, search) => {
              return updateUrl(prev, {search});
            },
          },
        },
        sort: true,
        pagination: {
          enabled: true,
          server: {
            url: (prev, page, limit) => {
              return updateUrl(prev, {start: page * limit, length: limit});
            },
          },
        }
      }).render(tableDiv);

      let savedValue;

      tableDiv.addEventListener('focusin', ev => {
        if (ev.target.tagName === 'TD') {
          savedValue = ev.target.textContent;
        }
      });

      tableDiv.addEventListener('focusout', ev => {
        if (ev.target.tagName === 'TD') {
<!--        data-column-id="price"-->
          if (savedValue !== ev.target.textContent) {

            console.log(ev);
            if (ev.target.dataset.columnId == 'price') {
                let receiptTotalDiv = document.getElementById('receipt-total');
                let totalPrice = parseFloat(receiptTotalDiv.innerHTML) - parseFloat(savedValue) + parseFloat(ev.target.textContent);
                receiptTotalDiv.innerHTML = Math.round(totalPrice * 100) / 100;
            }
            fetch('/api/data', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({
                id: ev.target.dataset.elementId,
                [ev.target.dataset.columnId]: ev.target.textContent
              }),
            });
          }
          savedValue = undefined;
        }
      });

      tableDiv.addEventListener('change', ev => {
        const select = ev.target;
        if (select.tagName !== 'SELECT') return;

        const row = select.closest('tr');
        const macroSelect = row.querySelector('select[data-field="macro_category"]');
        const microSelect = row.querySelector('select[data-field="micro_category"]');
        const macro = macroSelect ? macroSelect.value : null;
        const micros = TAXONOMY[macro] || [];

        if (select.dataset.field === 'macro_category' && microSelect) {
          // Keep the micro if it still belongs to the new macro, else take the first.
          const keep = micros.includes(microSelect.value) ? microSelect.value : micros[0];
          microSelect.innerHTML = micros.map(m =>
            `<option value="${escapeHtml(m)}"${m === keep ? ' selected' : ''}>${escapeHtml(m)}</option>`
          ).join('');
        }

        // Always send the pair: the server rejects a micro that doesn't fit its macro.
        fetch('/api/data', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            id: Number(select.dataset.itemId),
            macro_category: macro,
            micro_category: microSelect ? microSelect.value : null
          }),
        }).then(res => {
          if (!res.ok) alert('Could not save that category change.');
        });
      });

      tableDiv.addEventListener('keydown', ev => {
        if (ev.target.tagName === 'TD') {
          if (ev.key === 'Escape') {
            ev.target.textContent = savedValue;
            ev.target.blur();
          }
          else if (ev.key === 'Enter') {
            ev.preventDefault();
            ev.target.blur();
          }
        }
      });
    </script>
    <a class="btn btn-outline-secondary m-3" href="{{ url_for('item_table.receipts') }}">See All Receipts</a>
    <a class="btn btn-outline-secondary m-3" href="{{ url_for('item_table.photo') }}" target="_blank">Receipt Picture</a>
    <button class="btn btn-outline-secondary m-3" id="add-row-button">Add Row</button>
    <script>
      document.getElementById('add-row-button').onclick = function(){
        var request = new XMLHttpRequest();

        // We point the request at the appropriate command
        request.open("GET", "/" + "add-row", true);
        // and then we send it off
        request.send();
        // reload page to display new row
        location.reload();
      }
    </script>
    <div class="total-price mx-auto p-3">Total paid: <div class="d-inline" id="receipt-total">{{receipt_total}}</div></div>
    <div class="pb-4">
      <a class="btn btn-primary btn-lg" href="{{ url_for('receipt.index') }}">⬆️ Upload Next Receipt</a>
    </div>

{% endblock %}
